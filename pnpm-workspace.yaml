packages:
  - apps/*
  - packages/*

saveExact: true
engineStrict: true
# next-intl's message extractor (unused) brings these; the runtime needs neither build step.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  # drizzle-kit bundles the schema with esbuild; the platform binary arrives as an
  # optional dependency, so the install check is not needed.
  esbuild: false
