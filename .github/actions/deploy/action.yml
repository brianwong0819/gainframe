name: Deploy an environment
description: >-
  Builds the API, migrates the environment's database, applies its Terraform
  stack, builds and uploads the web app, and smoke-tests the result. Shared by
  the dev and prod jobs of deploy.yml; the caller checks out the commit and
  grants id-token: write.

inputs:
  environment:
    description: dev or prod; selects infra/envs/<environment> and /gainframe/<environment>/ in SSM.
    required: true
  account-id:
    description: The AWS account ID (the AWS_ACCOUNT_ID secret; composite actions cannot read secrets).
    required: true
  release:
    description: The commit CI tested, which every log line carries.
    required: true
  dev-pages:
    description: '"1" adds the developer pages (kitchen sink) to the build; dev only.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - name: Build the API
      # Terraform zips the bundle; the web app is built after apply, from its outputs.
      run: pnpm --filter @gainframe/api build
      shell: bash
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: 1.16.7
        terraform_wrapper: false
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: arn:aws:iam::${{ inputs.account-id }}:role/gainframe-ci-apply
        aws-region: ap-southeast-1
    - name: Migrate the database
      # Before the new code is live, so each migration is backward compatible
      # with the release still serving (docs/infra.md). The connection string
      # is masked before anything could print it. An environment's first
      # deploy creates the parameter, so until the owner sets it there is
      # nothing to migrate; the smoke test's database check then fails, and
      # the job is re-run once the parameter is set (infra/envs/prod/README.md).
      shell: bash
      env:
        PARAMETER: /gainframe/${{ inputs.environment }}/database-url
      run: |
        if ! DATABASE_URL=$(aws ssm get-parameter --name "${PARAMETER}" --with-decryption \
          --query Parameter.Value --output text 2> "${RUNNER_TEMP}/ssm.err"); then
          if grep -q ParameterNotFound "${RUNNER_TEMP}/ssm.err"; then
            echo "::notice::${PARAMETER} does not exist yet; skipping migrations"
            exit 0
          fi
          cat "${RUNNER_TEMP}/ssm.err"
          exit 1
        fi
        echo "::add-mask::${DATABASE_URL}"
        if [ "${DATABASE_URL}" = "placeholder" ]; then
          echo "::notice::${PARAMETER} is still the placeholder; skipping migrations"
          exit 0
        fi
        DATABASE_URL="${DATABASE_URL}" pnpm --filter @gainframe/api db:migrate
    - name: Apply
      shell: bash
      working-directory: infra/envs/${{ inputs.environment }}
      env:
        RELEASE: ${{ inputs.release }}
      run: |
        terraform init
        ../../../.github/scripts/mask-cognito-ids.sh "${RUNNER_TEMP}/redact.txt"
        terraform apply -no-color -auto-approve -lock-timeout=5m "-var=release=${RELEASE}"
        {
          echo "SITE_URL=$(terraform output -raw site_url)"
          echo "SITE_BUCKET=$(terraform output -raw site_bucket)"
          echo "DISTRIBUTION_ID=$(terraform output -raw distribution_id)"
          echo "LOG_GROUP=$(terraform output -raw api_log_group)"
          echo "FUNCTION_NAME=$(terraform output -raw api_function_name)"
        } >> "${GITHUB_ENV}"
        # Shipped in the public bundle anyway, but masked so the log does not
        # show it; masked again here for the first apply, which creates it.
        client_id=$(terraform output -raw auth_client_id)
        echo "::add-mask::${client_id}"
        {
          echo "NEXT_PUBLIC_AUTH_ORIGIN=$(terraform output -raw auth_domain_origin)"
          echo "NEXT_PUBLIC_AUTH_CLIENT_ID=${client_id}"
        } >> "${GITHUB_ENV}"
    - name: Build the web app
      shell: bash
      env:
        NEXT_PUBLIC_RELEASE: ${{ inputs.release }}
        GAINFRAME_DEV_PAGES: ${{ inputs.dev-pages }}
      run: pnpm --filter @gainframe/web build
    - name: Upload the site
      # Hashed assets first, so the new HTML never references a missing file.
      # HTML and route payloads are revalidated on every request.
      shell: bash
      run: |
        aws s3 sync apps/web/out/_next/static "s3://${SITE_BUCKET}/_next/static" \
          --cache-control "public, max-age=31536000, immutable"
        aws s3 sync apps/web/out "s3://${SITE_BUCKET}" \
          --exclude "_next/static/*" --cache-control "no-cache" --delete
    - name: Invalidate CloudFront
      shell: bash
      run: |
        id=$(aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" \
          --paths "/*" --query Invalidation.Id --output text)
        aws cloudfront wait invalidation-completed --distribution-id "${DISTRIBUTION_ID}" --id "${id}"
    - name: Remove old hashed assets
      # Only now that no edge serves the previous HTML.
      shell: bash
      run: |
        aws s3 sync apps/web/out/_next/static "s3://${SITE_BUCKET}/_next/static" \
          --cache-control "public, max-age=31536000, immutable" --delete
    - name: Smoke test
      # The page and the API serve this release, and the API's access line
      # for one request reaches CloudWatch with the same release.
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
      run: |
        page=$(curl -sSf "${SITE_URL}/")
        if ! grep -qF "<meta name=\"release\" content=\"${RELEASE}\"" <<< "${page}"; then
          echo "::error::the site does not serve release ${RELEASE}"
          exit 1
        fi
        # The route function serves an exported page at its clean URL.
        route_status=$(curl -sS -o /dev/null -w '%{http_code}' "${SITE_URL}/settings")
        if [ "${route_status}" != "200" ]; then
          echo "::error::/settings returned ${route_status}; the route function is not mapping routes"
          exit 1
        fi
        # Browsers refuse to register a service worker served with a non-script type.
        sw_type=$(curl -sSf -o /dev/null -w '%{content_type}' "${SITE_URL}/sw.js")
        if [[ "${sw_type}" != *javascript* ]]; then
          echo "::error::/sw.js is served as '${sw_type}', not JavaScript"
          exit 1
        fi
        # iOS reads the touch icon once, at Add to Home Screen, and draws a
        # letter monogram if it cannot load it.
        icon_type=$(curl -sSf -o /dev/null -w '%{content_type}' "${SITE_URL}/pwa/apple-touch-icon.png")
        if [ "${icon_type}" != "image/png" ]; then
          echo "::error::/pwa/apple-touch-icon.png is served as '${icon_type}', not a PNG"
          exit 1
        fi
        # Separate steps, not a pipeline: a failing curl inside a pipeline
        # does not fail the step, and a 503 once passed unnoticed (L-014).
        status=$(curl -sS -o "${RUNNER_TEMP}/health.json" -D "${RUNNER_TEMP}/health.headers" \
          -w '%{http_code}' "${SITE_URL}/api/health")
        cat "${RUNNER_TEMP}/health.json"; echo
        if [ "${status}" != "200" ] || [ "$(jq -r '.status' "${RUNNER_TEMP}/health.json")" != "ok" ]; then
          echo "::error::/api/health returned ${status}"
          exit 1
        fi
        # The public health route never queries the database; a direct
        # invocation, which needs IAM, runs the database check.
        aws lambda invoke --function-name "${FUNCTION_NAME}" --cli-binary-format raw-in-base64-out \
          --payload '{"check":"database"}' --output json "${RUNNER_TEMP}/database.json" \
          > "${RUNNER_TEMP}/invoke.json"
        if [ "$(jq -r '.FunctionError // empty' "${RUNNER_TEMP}/invoke.json")" != "" ]; then
          echo "::error::the database check invocation failed"
          exit 1
        fi
        cat "${RUNNER_TEMP}/database.json"; echo
        if [ "$(jq -r '.database' "${RUNNER_TEMP}/database.json")" != "connected" ]; then
          echo "::error::the API cannot reach its database"
          exit 1
        fi
        request_id=$(tr -d '\r' < "${RUNNER_TEMP}/health.headers" \
          | awk -F': ' 'tolower($1) == "x-request-id" { print $2 }')
        if [ -z "${request_id}" ]; then
          echo "::error::/api/health returned no x-request-id"
          exit 1
        fi
        echo "Request ID: ${request_id}"
        since=$(( ($(date +%s) - 300) * 1000 ))
        for attempt in $(seq 1 24); do
          # JSON output: the CLI paginates, and text output prints one value per page.
          line=$(aws logs filter-log-events --log-group-name "${LOG_GROUP}" --start-time "${since}" \
            --filter-pattern "{ \$.requestId = \"${request_id}\" && \$.msg = \"request\" }" \
            --query 'events[].message' --output json | jq -r '.[0] // empty')
          if [ -n "${line}" ]; then
            echo "${line}"
            logged=$(jq -r '.release' <<< "${line}")
            if [ "${logged}" != "${RELEASE}" ]; then
              echo "::error::the access line names release ${logged}, expected ${RELEASE}"
              exit 1
            fi
            exit 0
          fi
          sleep 5
        done
        echo "::error::no access line for request ${request_id} in ${LOG_GROUP} after two minutes"
        exit 1
