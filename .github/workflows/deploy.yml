name: Deploy

# Deploys main to dev once CI has passed on it. workflow_run runs this file
# from main, so the OIDC subject is ref:refs/heads/main, which the apply
# role's trust policy requires.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Never cancel a running apply; a newer commit waits and then deploys.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  dev:
    name: Deploy dev
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      # The commit CI tested, which is also the RELEASE every log line carries.
      RELEASE: ${{ github.event.workflow_run.head_sha }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: NEXT_PUBLIC_RELEASE="${RELEASE}" pnpm build
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.7
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/gainframe-ci-apply
          aws-region: ap-southeast-1
      - name: Apply
        working-directory: infra/envs/dev
        run: |
          terraform init
          terraform apply -no-color -auto-approve -lock-timeout=5m "-var=release=${RELEASE}"
          {
            echo "SITE_URL=$(terraform output -raw site_url)"
            echo "SITE_BUCKET=$(terraform output -raw site_bucket)"
            echo "DISTRIBUTION_ID=$(terraform output -raw distribution_id)"
            echo "LOG_GROUP=$(terraform output -raw api_log_group)"
          } >> "${GITHUB_ENV}"
      - name: Upload the site
        # Hashed assets first, so the new HTML never references a missing file.
        # HTML and route payloads are revalidated on every request.
        run: |
          aws s3 sync apps/web/out/_next/static "s3://${SITE_BUCKET}/_next/static" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync apps/web/out "s3://${SITE_BUCKET}" \
            --exclude "_next/static/*" --cache-control "no-cache" --delete
      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "${DISTRIBUTION_ID}" --id "${id}"
      - name: Remove old hashed assets
        # Only now that no edge serves the previous HTML.
        run: |
          aws s3 sync apps/web/out/_next/static "s3://${SITE_BUCKET}/_next/static" \
            --cache-control "public, max-age=31536000, immutable" --delete
      - name: Smoke test
        # The page and the API serve this release, and the API's access line
        # for one request reaches CloudWatch with the same release.
        run: |
          page=$(curl -sSf "${SITE_URL}/")
          if ! grep -qF "<meta name=\"release\" content=\"${RELEASE}\"" <<< "${page}"; then
            echo "::error::the site does not serve release ${RELEASE}"
            exit 1
          fi
          request_id=$(curl -sSf -o /dev/null -D - "${SITE_URL}/api/health" \
            | tr -d '\r' | awk -F': ' 'tolower($1) == "x-request-id" { print $2 }')
          if [ -z "${request_id}" ]; then
            echo "::error::/api/health returned no x-request-id"
            exit 1
          fi
          echo "Request ID: ${request_id}"
          since=$(( ($(date +%s) - 300) * 1000 ))
          for attempt in $(seq 1 24); do
            # JSON output: the CLI paginates, and text output prints one value per page.
            line=$(aws logs filter-log-events --log-group-name "${LOG_GROUP}" --start-time "${since}" \
              --filter-pattern "{ \$.requestId = \"${request_id}\" && \$.msg = \"request\" }" \
              --query 'events[].message' --output json | jq -r '.[0] // empty')
            if [ -n "${line}" ]; then
              echo "${line}"
              logged=$(jq -r '.release' <<< "${line}")
              if [ "${logged}" != "${RELEASE}" ]; then
                echo "::error::the access line names release ${logged}, expected ${RELEASE}"
                exit 1
              fi
              exit 0
            fi
            sleep 5
          done
          echo "::error::no access line for request ${request_id} in ${LOG_GROUP} after two minutes"
          exit 1
