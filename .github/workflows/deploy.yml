name: Deploy

# Deploys main to dev once CI has passed on it, then to prod once the owner
# approves the prod Environment. workflow_run runs this file from main, so the
# dev job's OIDC subject is ref:refs/heads/main; a job in an Environment gets
# environment:prod instead. The apply role's trust policy lists both. The steps
# are the composite action .github/actions/deploy.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  # CI runs can finish out of order, so a deploy for an older commit could
  # overwrite a newer one (L-022). Only the commit at the tip of main deploys;
  # an older one is skipped because the newer commit's own run deploys it.
  latest:
    name: Check the commit is main's tip
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.tip.outputs.deploy }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          echo "main is at ${tip}; CI passed on ${SHA}"
          if [ "${tip}" = "${SHA}" ]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::skipped: ${SHA} is no longer main's tip"
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
          fi

  dev:
    name: Deploy dev
    needs: latest
    if: needs.latest.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Never cancel a running apply; a newer commit waits and then deploys.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/deploy
        with:
          environment: dev
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          release: ${{ github.event.workflow_run.head_sha }}
          dev-pages: '1'

  # Waits for the owner's approval in the prod Environment (required reviewer,
  # main only). An approval can come after a newer commit has deployed, so the
  # tip is checked again and an older commit never replaces a newer one (L-022).
  prod:
    name: Deploy prod
    needs: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "${tip}" = "${SHA}" ]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::skipped: ${SHA} is no longer main's tip; approve the newer run"
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tip.outputs.deploy == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/deploy
        if: steps.tip.outputs.deploy == 'true'
        with:
          environment: prod
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          release: ${{ github.event.workflow_run.head_sha }}
