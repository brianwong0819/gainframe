name: Terraform plan

# Posts the dev and prod plans on every pull request that can change the infrastructure.
# The API bundle is an input: the api module zips it, so code changes show up
# as a Lambda update.
on:
  pull_request:
    paths:
      - infra/**
      - apps/api/**
      - packages/shared/**
      - pnpm-lock.yaml
      - .github/workflows/plan.yml
      - .github/scripts/mask-cognito-ids.sh
      - .github/scripts/redact-cognito-ids.sed

permissions:
  contents: read

concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan dev and prod
    # Pull requests from forks get no OIDC token, so they cannot plan.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gainframe/api build
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.7
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/gainframe-ci-plan
          aws-region: ap-southeast-1
      - name: Plan
        working-directory: infra/envs
        env:
          RELEASE: ${{ github.event.pull_request.head.sha }}
        # A step without an explicit shell runs without pipefail, and a failed
        # plan must not pass through the filter unnoticed.
        run: |
          set -o pipefail
          for env in dev prod; do
            terraform -chdir="${env}" init
            (cd "${env}" && ../../../.github/scripts/mask-cognito-ids.sh "${RUNNER_TEMP}/redact.txt")
            terraform -chdir="${env}" plan -no-color -lock-timeout=5m "-var=release=${RELEASE}" -out=plan.tfplan \
              | sed -E -f ../../.github/scripts/redact-cognito-ids.sed
          done
      - name: Comment the plans
        working-directory: infra/envs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        # The comment is public: the account ID and the Cognito IDs are
        # replaced, and the body stays under GitHub's 65,536-character limit
        # (30,000 characters of plan per environment).
        run: |
          for env in dev prod; do
            terraform -chdir="${env}" show -no-color plan.tfplan > "${env}.txt"
          done
          {
            echo "### Terraform plan"
            echo
            echo "Commit ${HEAD_SHA}"
            for env in dev prod; do
              echo
              echo "**${env}**: $(grep -E '^(Plan:|No changes\.)' "${env}.txt" || echo 'see the full plan')"
              echo
              echo "<details><summary>Full ${env} plan</summary>"
              echo
              echo '```'
              head -c 30000 "${env}.txt"
              echo
              echo '```'
              echo "</details>"
            done
          } | sed "s/${ACCOUNT_ID}/<account-id>/g" | sed -E -f ../../.github/scripts/redact-cognito-ids.sed > comment.md
          touch "${RUNNER_TEMP}/redact.txt"
          while read -r value; do
            sed -i "s/${value}/<cognito-id>/g" comment.md
          done < "${RUNNER_TEMP}/redact.txt"
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file comment.md --edit-last --create-if-none
