name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Same image as docker-compose.yml.
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: gainframe
          POSTGRES_PASSWORD: gainframe
          POSTGRES_DB: gainframe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gainframe -d gainframe"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # Throwaway credentials for the service container above.
      DATABASE_URL: postgres://gainframe:gainframe@localhost:5432/gainframe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build

  devices:
    name: Device layout
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        # WebKit stands in for iOS Safari, Chromium for Android Chrome.
        run: pnpm --filter @gainframe/web exec playwright install --with-deps chromium webkit
      - name: Build the web app with the dev pages
        run: pnpm --filter @gainframe/web build
        env:
          GAINFRAME_DEV_PAGES: '1'
      - run: pnpm test:e2e
      - name: Upload the report with screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-layout-report
          path: apps/web/playwright-report/
          retention-days: 14

  terraform:
    name: Terraform checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.7
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: Validate every stack
        # The modules are validated through the stacks that call them.
        run: |
          for stack in infra/bootstrap infra/envs/dev; do
            terraform -chdir="${stack}" init -backend=false -input=false
            terraform -chdir="${stack}" validate
          done

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret removed in a later commit is still published.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
      - name: Check that the account ID rules fire
        # The sample is built at runtime so the repository itself never contains one.
        run: |
          sample="role = \"arn:aws:iam::$(printf '%012d' 42):role/ci\""
          status=0
          printf '%s\n' "${sample}" | "${RUNNER_TEMP}/gitleaks" stdin --config .gitleaks.toml --no-banner --redact --exit-code 2 || status=$?
          if [ "${status}" -ne 2 ]; then
            echo "::error::expected a finding (exit 2), got exit ${status}"
            exit 1
          fi
      - name: Scan git history
        run: '"${RUNNER_TEMP}/gitleaks" git . --config .gitleaks.toml --no-banner --redact --verbose'
