name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Same image as docker-compose.yml.
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: gainframe
          POSTGRES_PASSWORD: gainframe
          POSTGRES_DB: gainframe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gainframe -d gainframe"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # Throwaway credentials for the service container above.
      DATABASE_URL: postgres://gainframe:gainframe@localhost:5432/gainframe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - name: Migrations match the schema
        # A schema change without its generated migration would deploy code
        # that queries columns the database does not have.
        run: |
          pnpm --filter @gainframe/api db:generate
          if [ -n "$(git status --porcelain apps/api/drizzle)" ]; then
            git status --porcelain apps/api/drizzle
            echo "::error::apps/api/src/db/schema.ts changed without a migration; run pnpm --filter @gainframe/api db:generate"
            exit 1
          fi
      - run: pnpm build

  # The most expensive job (WebKit and Chromium over every page). To keep the
  # monthly Actions minutes in budget, a pull request runs one WebKit and one
  # Chromium device and main runs the full matrix; a pull request that only
  # changes docs skips the tests. The job itself always runs, so the required
  # "Device layout" check is reported either way.
  devices:
    name: Device layout
    runs-on: ubuntu-24.04
    # On main the suite runs on six devices (about 8 minutes for 630 tests on
    # 2026-11-23) after a browser install that took from 1 to 11 minutes; a
    # timeout cancels the run and skips the deploy (L-049).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request merge commit and its base, to list the changed files.
          fetch-depth: 2
          persist-credentials: false
      - name: Check whether the pull request changes the app
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only --no-renames HEAD^1 HEAD > "${RUNNER_TEMP}/changed.txt"
          if grep -qvE '^(docs/.*|.*\.md)$' "${RUNNER_TEMP}/changed.txt"; then
            echo "app=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::docs-only change; device tests skipped"
            echo "app=false" >> "${GITHUB_OUTPUT}"
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.scope.outputs.app != 'false'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.app != 'false'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.scope.outputs.app != 'false'
        run: pnpm install --frozen-lockfile
      - name: Install browsers
        if: steps.scope.outputs.app != 'false'
        # WebKit stands in for iOS Safari, Chromium for Android Chrome.
        run: pnpm --filter @gainframe/web exec playwright install --with-deps chromium webkit
      - name: Build the web app with the dev pages
        if: steps.scope.outputs.app != 'false'
        run: pnpm --filter @gainframe/web build
        env:
          GAINFRAME_DEV_PAGES: '1'
      - name: Run the device tests
        if: steps.scope.outputs.app != 'false'
        env:
          EVENT: ${{ github.event_name }}
        # iPhone SE is the smallest WebKit screen, Galaxy S24 the narrowest
        # Chromium one; names from apps/web/e2e/devices.ts.
        run: |
          if [ "${EVENT}" = "pull_request" ]; then
            pnpm test:e2e frame-diagnostic --repeat-each 3
          else
            pnpm test:e2e
          fi
      - name: Upload the report with screenshots
        if: ${{ !cancelled() && steps.scope.outputs.app != 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-layout-report
          path: apps/web/playwright-report/
          retention-days: 14

  terraform:
    name: Terraform checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.7
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: Validate every stack
        # The modules are validated through the stacks that call them.
        run: |
          for stack in infra/bootstrap infra/envs/dev infra/envs/prod; do
            terraform -chdir="${stack}" init -backend=false -input=false
            terraform -chdir="${stack}" validate
          done

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret removed in a later commit is still published.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
      - name: Check that the account ID rules fire
        # The sample is built at runtime so the repository itself never contains one.
        run: |
          sample="role = \"arn:aws:iam::$(printf '%012d' 42):role/ci\""
          status=0
          printf '%s\n' "${sample}" | "${RUNNER_TEMP}/gitleaks" stdin --config .gitleaks.toml --no-banner --redact --exit-code 2 || status=$?
          if [ "${status}" -ne 2 ]; then
            echo "::error::expected a finding (exit 2), got exit ${status}"
            exit 1
          fi
      - name: Scan git history
        run: '"${RUNNER_TEMP}/gitleaks" git . --config .gitleaks.toml --no-banner --redact --verbose'
